<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Správa webu – 10men</title>
<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#EE220C;--red-d:#c41a09;--ink:#111;--muted:#6e6e73;--line:#e5e5ea;--bg:#f2f2f7;--card:#fff;--ok:#1a8a4a;--warn:#b26a00;--r:16px;--nav-h:64px;--side:232px}
@media(prefers-color-scheme:dark){:root{--ink:#f5f5f7;--muted:#98989f;--line:#2c2c2e;--bg:#000;--card:#1c1c1e}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* přihlášení */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#111}
.login-card{background:var(--card);border-radius:24px;padding:40px 32px;max-width:380px;width:100%;text-align:center}
.login-card h1{font-size:28px;font-weight:800;letter-spacing:-.03em}.login-card h1 span{color:var(--red)}
.login-card p{color:var(--muted);margin:8px 0 28px;font-size:14px}
.login-card .err{color:var(--red);font-size:13px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--ink) 8%,transparent);transition:background .15s}
.btn:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%;padding:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
/* kostra */
#app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:#111;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside .brand{font-size:20px;font-weight:800;letter-spacing:-.03em;padding:0 10px 18px}aside .brand span{color:var(--red)}
.nav-b{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;color:#bbb;padding:11px 12px;border-radius:12px;font-weight:600;text-align:left}
.nav-b:hover{background:#1d1d1f;color:#fff}.nav-b.on{background:rgba(238,34,12,.16);color:#fff}
.nav-b svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-b .dot{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px}
aside .who{margin-top:auto;padding:12px;font-size:13px;color:#999;border-top:1px solid #222}aside .who b{display:block;color:#fff;font-size:14px}aside .who button{margin-top:8px;background:none;border:none;color:#999;padding:0;text-decoration:underline;font-size:13px}
main{min-width:0;padding:28px 32px 48px;max-width:1040px;width:100%}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em;flex:1;min-width:160px}
.pub-state{font-size:13px;color:var(--muted)}.pub-state.dirty{color:var(--warn);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;font-weight:700;margin-bottom:4px}.card .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:none}
.row .date{width:52px;flex:none;text-align:center;line-height:1.1}.row .date b{display:block;font-size:22px;font-weight:800}.row .date small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row .info{flex:1;min-width:0}.row .info .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .info .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.chip.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 7%,transparent);margin-bottom:16px;overflow-x:auto}
.seg button{flex:1;border:none;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.work{font-size:12px;color:var(--warn)}
/* formuláře */
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lang-tabs{display:flex;gap:6px;margin:14px 0 4px;align-items:center;flex-wrap:wrap}
.lang-tabs button.lt{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-weight:700;font-size:12px;color:var(--muted)}.lang-tabs button.lt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lang-tabs .tr{margin-left:auto}
.lp{display:none}.lp.on{display:block}
/* modální okna */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.dlg{background:var(--card);border-radius:22px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.dlg.big{max-width:880px}
.dlg header{display:flex;align-items:center;gap:12px;padding:18px 22px 10px}.dlg header h2{flex:1;font-size:18px;font-weight:800;letter-spacing:-.02em}
.dlg header .x{border:none;background:color-mix(in srgb,var(--ink) 8%,transparent);width:34px;height:34px;border-radius:50%;font-size:16px}
.dlg .body{padding:6px 22px 18px;overflow-y:auto;flex:1}
.dlg footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.panel{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:14px;padding:14px;margin-top:14px}
.panel h3{font-size:13px;font-weight:700;margin-bottom:8px}
.find{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.find:first-of-type{border-top:none}
.find input{margin-top:3px;width:18px;height:18px;flex:none}.find.block{color:var(--red)}
.find b{font-weight:700}.find .where{color:var(--muted);font-size:12px}
iframe.pv{width:100%;height:230px;border:1px solid var(--line);border-radius:12px;background:#fafaf8}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.err{background:var(--red)}
.tl-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.tl-row:first-of-type{border-top:none}.tl-row .y{font-weight:800;width:48px}.tl-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}.drop img{max-width:160px;max-height:120px;border-radius:10px;margin:8px auto 0;display:block}
/* mobil */
#bar{display:none}
@media(max-width:820px){
  #app{display:block}aside{display:none}
  main{padding:16px 16px calc(var(--nav-h) + 28px)}
  .top h1{font-size:22px}
  #bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:var(--nav-h);background:var(--card);border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:50;padding:6px}
  #bar button{flex:1;border:none;background:transparent;border-radius:20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative}
  #bar button.on{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
  #bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #bar .dot{position:absolute;top:6px;right:22%;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
  .ov{padding:0;align-items:flex-end}.dlg,.dlg.big{max-width:none;border-radius:22px 22px 0 0;max-height:94vh}
  .cols{grid-template-columns:1fr}.grid2{grid-template-columns:1fr 1fr}
  .row .info .t,.row .info .m{white-space:normal}
  .dlg footer{display:grid;grid-template-columns:1fr 1fr;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .dlg footer .btn.primary{grid-column:1/-1;order:-2}
  .dlg footer [data-save]{grid-column:1/-1;order:-1}
  .dlg footer [data-del]{margin:0!important}
  #toast{top:calc(14px + env(safe-area-inset-top));bottom:auto;transform:translateX(-50%) translateY(-20px)}
  #toast.show{transform:translateX(-50%)}
}
</style>
</head>
<body>
<div id="login" class="hidden"><div class="login-card"><h1>10<span>men</span> · správa webu</h1><p>Přihlaste se účtem, který používáte v 10base a 10space.</p><button class="btn primary wide" id="btn-login">Přihlásit se přes Google</button><div class="err" id="login-err"></div></div></div>
<div id="denied" class="hidden" style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div class="card" style="max-width:420px"><h2 style="font-size:20px">Nemáte přístup ke správě webu</h2><p class="sub" style="margin:10px 0 18px">Přístup uděluje administrátor. Ozvěte se mu a uveďte e-mail, kterým jste se přihlásili.</p><button class="btn" id="btn-denied-out">Odhlásit se</button></div></div>
<div id="app" class="hidden">
  <aside>
    <div class="brand">10<span>men</span> web</div>
    <div id="nav-d"></div>
    <div class="who"><b id="who-name"></b><span id="who-mail"></span><br><button id="btn-out">Odhlásit se</button></div>
  </aside>
  <main>
    <div class="top"><h1 id="title"></h1><span class="pub-state" id="pubstate"></span><button class="btn primary" id="btn-publish">Zveřejnit změny</button></div>
    <div id="view"></div>
  </main>
  <nav id="bar"></nav>
</div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
import { getDatabase, ref, onValue, get } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js';

const app = initializeApp({ apiKey: "AIzaSyAjDCB3gpqytTHnG7zKLKJGXMNeW5vyC_I", authDomain: "base-39f52.firebaseapp.com", databaseURL: "https://base-39f52-default-rtdb.europe-west1.firebasedatabase.app", projectId: "base-39f52", appId: "1:20753597026:web:bec0c5a784492206f3c73b" });
const auth = getAuth(app), db = getDatabase(app);
const API = 'https://us-central1-base-39f52.cloudfunctions.net/webAdmin';
const LANGS = ['cs', 'en', 'de', 'es'], LNAME = { cs: 'Česky', en: 'English', de: 'Deutsch', es: 'Español' };
const MO = ['led', 'úno', 'bře', 'dub', 'kvě', 'čvn', 'čvc', 'srp', 'zář', 'říj', 'lis', 'pro'];
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  page: '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  chat: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  hist: '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 8v5l3 2"/></svg>'
};
const TABS = [['home', 'Přehled', IC.home], ['events', 'Akce', IC.cal], ['pages', 'Stránky', IC.page], ['discord', 'Discord', IC.chat], ['history', 'Historie', IC.hist]];

/* ── stav ── */
const S = { user: null, web: {}, tab: 'home', filter: 'upcoming', inbox: null, busy: false, hashes: {} };
const web = () => S.web || {};
const concerts = () => Object.entries(web().concerts || {}).map(([id, c]) => ({ id, ...c }));

/* ── pomocné ── */
let tt; function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', err ? 6000 : 3200); }
async function call(body) {
  const tok = await auth.currentUser.getIdToken();
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Akce se nezdařila.'); e.status = r.status; throw e; }
  return j;
}
const canon = v => Array.isArray(v) ? v.map(canon) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v;
async function sha256(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const hashOf = c => sha256(JSON.stringify(canon([c.date, c.time || '', !!c.highlight, c.title || {}, c.venue || {}, c.desc || {}, c.dateDisplay || {}, c.mapsUrl || '', c.fbUrl || '', c.ticketsUrl || '', c.photosUrl || ''])));
async function reviewed(c) { return !!(c.review && c.review.hash === await hashOf(c)); }
const fmtWhen = ts => ts ? new Date(ts).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Prague' });
const stateLabel = { koncept: ['Koncept', ''], zverejneno: ['Zveřejněno', 'ok'], skryto: ['Skryto', 'warn'] };

/* ── modální okna ── */
function modal({ title, body, footer = '', big = false, onClose }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="dlg${big ? ' big' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" aria-label="Zavřít" data-x>✕</button></header><div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ''}</div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', key, true); onClose && onClose(); };
  const key = e => { if (e.key === 'Escape' && ov === [...document.querySelectorAll('.ov')].pop()) { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', key, true);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  $('[data-x]', ov).onclick = close;
  return { ov, close };
}
function ask(title, text, okLabel = 'Pokračovat', danger = false) {
  return new Promise(res => {
    const m = modal({ title, body: `<p style="margin:6px 0 4px;white-space:pre-line">${esc(text)}</p>`, footer: `<button class="btn" data-n>Zrušit</button><button class="btn ${danger ? 'danger' : 'primary'}" data-y>${esc(okLabel)}</button>`, onClose: () => res(false) });
    $('[data-n]', m.ov).onclick = () => m.close();
    $('[data-y]', m.ov).onclick = () => { m.ov.remove(); res(true); };
  });
}
async function guarded(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; } }

/* ── vícejazyčná pole ── */
function locBlock(id, fields, v = {}) {
  return `<div class="lb" id="${id}"><div class="lang-tabs">${LANGS.map((l, i) => `<button type="button" class="lt${i ? '' : ' on'}" data-lang="${l}">${l.toUpperCase()}</button>`).join('')}<button type="button" class="btn sm tr" data-translate>Přeložit do EN / DE / ES</button></div>${LANGS.map((l, i) => `<div class="lp${i ? '' : ' on'}" data-lp="${l}">${fields.map(f => `<label class="l">${esc(f.label)} <span class="hint">(${LNAME[l]}${l === 'cs' && f.req ? ', povinné' : ''})</span></label>${f.area ? `<textarea data-f="${f.key}" data-l="${l}" maxlength="${f.max}" rows="${f.rows || 3}">${esc((v[f.key] || {})[l] || '')}</textarea>` : `<input type="text" data-f="${f.key}" data-l="${l}" maxlength="${f.max}" value="${esc((v[f.key] || {})[l] || '')}">`}`).join('')}</div>`).join('')}</div>`;
}
function readLoc(root, fields) { const o = {}; fields.forEach(f => { o[f.key] = {}; LANGS.forEach(l => { const el = $(`[data-f="${f.key}"][data-l="${l}"]`, root); const t = el ? el.value.trim() : ''; if (t) o[f.key][l] = t; }); }); return o; }
function wireLoc(root, fields, onChange) {
  $$('.lt', root).forEach(b => b.onclick = () => { $$('.lt', root).forEach(x => x.classList.toggle('on', x === b)); $$('.lp', root).forEach(p => p.classList.toggle('on', p.dataset.lp === b.dataset.lang)); });
  $$('input,textarea', root).forEach(e => e.addEventListener('input', () => onChange && onChange()));
  const tb = $('[data-translate]', root);
  tb.onclick = () => guarded(tb, async () => {
    const cs = readLoc(root, fields), keys = fields.filter(f => cs[f.key].cs);
    if (!keys.length) { toast('Nejdřív vyplň český text.', true); return; }
    tb.textContent = 'Překládám…';
    try {
      const r = await call({ action: 'translate', texts: keys.map(f => cs[f.key].cs) });
      keys.forEach((f, i) => ['en', 'de', 'es'].forEach(l => { const el = $(`[data-f="${f.key}"][data-l="${l}"]`, root); if (el) el.value = r.translations[i][l]; }));
      onChange && onChange(); toast('Přeloženo. Překlady si prosím přečtěte.');
    } finally { tb.textContent = 'Přeložit do EN / DE / ES'; }
  });
}

/* ── vykreslení ── */
const dirtyChanges = () => { const p = web().published; const t = p ? p.publishedAt : 0; return concerts().some(c => (c.updatedAt || 0) > t) || ['site'].some(k => (web()[k] || {}).updatedAt > t) || ((web().pages || {})['o-nas'] || {}).updatedAt > t; };
function chrome() {
  const nav = TABS.map(([k, n, ic]) => `<button class="nav-b${S.tab === k ? ' on' : ''}" data-tab="${k}">${ic}${n}${k === 'home' && S.inbox && S.inbox.length ? `<span class="dot">${S.inbox.length}</span>` : ''}</button>`).join('');
  $('#nav-d').innerHTML = nav;
  $('#bar').innerHTML = TABS.map(([k, n, ic]) => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${ic}${n}${k === 'home' && S.inbox && S.inbox.length ? `<span class="dot">${S.inbox.length}</span>` : ''}</button>`).join('');
  $$('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));

    const isT = kind === 'tl', arr = isT ? state.timeline : state.awards, it = i >= 0 ? arr[i] : isT ? { year: new Date().getFullYear(), h: {}, p: {} } : { id: '', desc: {} };
    const F = isT ? [{ key: 'h', label: 'Nadpis', max: 120 }, { key: 'p', label: 'Popis', max: 700, area: true, rows: 3 }] : [{ key: 'desc', label: 'Popis ocenění', max: 400, area: true, rows: 3 }];
    const m = modal({ title: isT ? 'Událost' : 'Ocenění', body: (isT ? `<label class="l">Rok</label><input type="number" id="it-year" value="${esc(it.year)}">` : `<label class="l">Název soutěže nebo festivalu</label><input type="text" id="it-name" maxlength="80" value="${esc(it.name || '')}"><div class="grid2"><div><label class="l">Roky (např. 2016, 2017, 2024)</label><input type="text" id="it-years" maxlength="60" value="${esc(it.years || '')}"></div><div><label class="l">Identifikátor (malá písmena a pomlčky)</label><input type="text" id="it-id" maxlength="40" value="${esc(it.id)}"></div></div>`) + locBlock('it-loc', F, it), footer: '<button class="btn" data-n>Zrušit</button><button class="btn primary" data-y>Hotovo</button>' });
    wireLoc($('#it-loc', m.ov), F); $('[data-n]', m.ov).onclick = m.close;
    $('[data-y]', m.ov).onclick = () => { const l = readLoc($('#it-loc', m.ov), F), n = isT ? { year: +$('#it-year', m.ov).value, ...l } : { id: $('#it-id', m.ov).value.trim(), name: $('#it-name', m.ov).value.trim(), years: $('#it-years', m.ov).value.trim(), ...l }; if (i >= 0) arr[i] = n; else arr.push(n); m.close(); lists(); };
  }
  $('#tl-add', v).onclick = () => editItem('tl', -1); $('#aw-add', v).onclick = () => editItem('aw', -1); lists();
  const so = $('#o-save', v); so.onclick = () => guarded(so, async () => {
    const about = {}; ['lead', 'p1', 'p2', 'p3'].forEach(k => about[k] = readLoc($('#o-' + k, v), [OF[k]])[k]);
    await call({ action: 'page_save', page: 'o-nas', data: { about, conductor: { name: $('#o-cname', v).value.trim(), bio: readLoc($('#o-bio', v), [OF.bio]).bio }, timeline: state.timeline, awards: state.awards } }); toast('„O nás“ uloženo. Zveřejníte tlačítkem nahoře.');
  });
  const ss = $('#s-save', v); ss.onclick = () => guarded(ss, async () => { await call({ action: 'page_save', page: 'site', data: { facts: { founded: +$('#s-founded', v).value, awards: +$('#s-awards', v).value, concerts: readLoc($('#s-conc', v), [{ key: 'concerts' }]).concerts }, email: $('#s-email', v).value.trim() } }); toast('Údaje uloženy.'); });
}

/* ── Discord ── */
let dImg = null;
function compress(file) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, 2560 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('Komprese selhala.')), 'image/jpeg', 0.86); }; img.onerror = () => rej(new Error('Soubor se nepodařilo načíst jako obrázek.')); img.src = u; });
}
function viewDiscord(v) {
  v.innerHTML = `<div class="card"><h2>Zpráva na Discord</h2><p class="sub">Odešle se do veřejného kanálu skupiny. Nevkládejte interní informace.</p><label class="l">Text <span class="hint" id="d-cnt">0 / 1800</span></label><textarea id="d-text" maxlength="1800" rows="5"></textarea><label class="l">Fotka (nepovinné)</label><div class="drop" id="d-drop">Klepněte nebo přetáhněte obrázek<div id="d-prev"></div></div><input type="file" id="d-file" accept="image/*" class="hidden"><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px"><button class="btn" id="d-clear">Zrušit</button><button class="btn primary" id="d-send">Odeslat na Discord</button></div></div>`;
  const t = $('#d-text', v), f = $('#d-file', v);
  t.oninput = () => $('#d-cnt', v).textContent = `${t.value.length} / 1800`;
  $('#d-drop', v).onclick = () => f.click();
  f.onchange = () => f.files[0] && pick(f.files[0]);
  async function pick(file) { if (!file.type.startsWith('image/')) { toast('Podporované jsou jen obrázky.', true); return; } try { dImg = await compress(file); $('#d-prev', v).innerHTML = `<img alt="Náhled" src="${URL.createObjectURL(dImg)}"><div class="hint">${(dImg.size / 1048576).toFixed(1)} MB</div>`; } catch (e) { toast(e.message, true); } }
  $('#d-clear', v).onclick = () => { t.value = ''; dImg = null; f.value = ''; $('#d-prev', v).innerHTML = ''; t.oninput(); };
  const s = $('#d-send', v); s.onclick = () => guarded(s, async () => {
    if (!t.value.trim() && !dImg) { toast('Vyplňte text nebo přidejte fotku.', true); return; }
    let b64 = null; if (dImg) b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(dImg); });
    await call({ action: 'discord_send', text: t.value, imageBase64: b64 }); toast('Odesláno na Discord ✓'); $('#d-clear', v).onclick();
  });
}

/* ── historie ── */
function viewHistory(v) {
  const h = Object.entries(web().history || {}).sort((a, b) => b[0] - a[0]);
  v.innerHTML = `<div class="card" style="padding:8px 20px">${h.length ? h.map(([k, x]) => `<div class="row"><div class="info"><div class="t">${esc(fmtWhen(x.at))} · ${esc((x.by || {}).name || '')}</div><div class="m">Zveřejněno akcí: ${esc(x.concerts)}${(x.skipped || []).length ? ` · přeskočeno: ${x.skipped.length}` : ''}${(x.warnings || []).length ? ` · upozornění: ${x.warnings.length}` : ''}</div></div></div>`).join('') : '<div class="empty">Zatím žádné zveřejnění.</div>'}</div>`;
}

/* ── přihlášení a start ── */
$('#btn-login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $('#login-err').textContent = 'Přihlášení se nezdařilo.'; });
$('#btn-out').onclick = $('#btn-denied-out').onclick = () => signOut(auth);
let started = false;
onAuthStateChanged(auth, user => {
  S.user = user;
  if (!user) { $('#app').classList.add('hidden'); $('#denied').classList.add('hidden'); $('#login').classList.remove('hidden'); return; }
  $('#login').classList.add('hidden');
  $('#who-name').textContent = user.displayName || ''; $('#who-mail').textContent = user.email || '';
  onValue(ref(db, `/webAccess/${user.uid}`), snap => {
    if (snap.val() !== true) { $('#app').classList.add('hidden'); $('#denied').classList.remove('hidden'); return; }
    $('#denied').classList.add('hidden'); $('#app').classList.remove('hidden');
    if (started) return; started = true;
    onValue(ref(db, '/web'), s => { S.web = s.val() || {}; render(); }, () => toast('Obsah webu se nepodařilo načíst.', true));
    loadInbox();
  }, () => { $('#app').classList.add('hidden'); $('#denied').classList.remove('hidden'); });
});
</script>
